<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heaven · Portfólio</title>
<meta name="description" content="Projetos entregues pela Heaven Agência de Marketing." />

<!-- Página de envio direto: fora do menu e fora do Google, por decisão. -->
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="image" href="/assets/heaven-logo.webp" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* Mesmos tokens do styles.css — a página é autossuficiente, como /linkbio e /em-breve. */
  :root {
    --bg: #07070b;
    --surface: #14161f;
    --surface-2: #1a1d28;
    --border: rgba(80, 130, 220, 0.18);
    --border-strong: rgba(80, 130, 220, 0.35);
    --text: #e9edf5;
    --text-dim: #a4abbc;
    --text-mute: #6b7387;
    --accent: #3b9eff;
    --accent-glow: rgba(59, 158, 255, 0.35);
    --gold: #d9a544;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    background:
      radial-gradient(120% 55% at 50% -10%, rgba(59, 158, 255, 0.12), transparent 62%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    padding: 44px 22px 80px;
  }

  img { max-width: 100%; display: block; }
  .wrap { max-width: 1140px; margin: 0 auto; }

  /* ---------- Cabeçalho ---------- */
  .pf-head { display: flex; flex-direction: column; align-items: flex-start; }
  /* O arquivo do logo tem bastante área transparente em volta, então altura
     pequena o deixa minúsculo. A landing usa 176px pelo mesmo motivo. */
  .pf-logo {
    height: 140px; width: auto; object-fit: contain;
    margin-left: -10px;
    filter: drop-shadow(0 0 40px var(--accent-glow));
  }
  @media (max-width: 640px) { .pf-logo { height: 104px; } }
  .pf-tag {
    margin-top: 22px;
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--gold); font-weight: 600;
  }
  .pf-head h1 {
    font-family: 'Outfit', 'Inter', sans-serif;
    font-weight: 600; letter-spacing: -.02em; line-height: 1.08;
    font-size: clamp(30px, 5vw, 46px);
    margin-top: 8px; color: #fff; text-wrap: balance;
  }
  .pf-head h1 .accent { color: var(--accent); }
  .pf-head p {
    color: var(--text-dim); font-size: 15px; margin-top: 14px; max-width: 620px;
  }

  /* ---------- Grade ---------- */
  .pf-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; margin-top: 42px;
  }
  @media (max-width: 860px) { .pf-grid { grid-template-columns: 1fr; } }

  .pf-card {
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 10px 30px -16px rgba(0, 0, 0, .8);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .pf-card.is-live:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 16px 44px -18px var(--accent-glow);
  }

  /* Capa: imagem quando existe, senão a arte gerada com as cores do cliente. */
  .pf-cover {
    position: relative; aspect-ratio: 16 / 9; overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .pf-cover img { width: 100%; height: 100%; object-fit: cover; }
  .pf-cover-art {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%);
  }
  .pf-cover-art::after {
    content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.06) 0 2px, transparent 2px 26px),
      radial-gradient(70% 90% at 80% 10%, rgba(255,255,255,.16), transparent 60%);
  }
  .pf-cover-art span {
    position: relative; z-index: 1;
    font-family: 'Outfit', 'Inter', sans-serif;
    font-size: clamp(26px, 4vw, 40px); font-weight: 600; letter-spacing: .04em;
    color: rgba(255,255,255,.94); text-shadow: 0 2px 24px rgba(0,0,0,.35);
  }
  .pf-chip-tipo {
    position: absolute; z-index: 2; top: 12px; left: 12px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(7,7,11,.72); backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text);
  }
  .pf-chip-status {
    position: absolute; z-index: 2; top: 12px; right: 12px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(7,7,11,.72); backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    font-size: 11px; font-weight: 600;
  }
  .pf-chip-status.live { color: #34d399; }
  .pf-chip-status.soon { color: var(--gold); }
  .pf-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---------- Corpo ---------- */
  .pf-body { padding: 22px 22px 0; flex: 1; }
  .pf-seg { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-mute); }
  .pf-cliente {
    font-family: 'Outfit', 'Inter', sans-serif;
    font-size: 26px; font-weight: 600; letter-spacing: -.02em; color: #fff; margin-top: 4px;
  }
  .pf-titulo { font-size: 15px; font-weight: 500; color: var(--text); margin-top: 10px; line-height: 1.4; }
  .pf-resumo { font-size: 14px; color: var(--text-dim); margin-top: 10px; }

  .pf-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
  .pf-chips li {
    list-style: none; padding: 5px 11px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim);
  }

  /* ---------- Rodapé do card ---------- */
  .pf-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 22px 20px; margin-top: 18px;
    border-top: 1px solid var(--border);
  }
  .pf-ano { font-size: 12px; color: var(--text-mute); margin-right: auto; }

  .pf-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer;
    background: var(--accent); color: #04101f; border: 1px solid var(--accent);
    transition: filter .18s ease, transform .18s ease;
  }
  .pf-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .pf-btn[aria-disabled='true'] {
    background: var(--surface-2); color: var(--text-mute); border-color: var(--border);
    cursor: not-allowed; pointer-events: none;
  }
  .pf-copy {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 15px; border-radius: 999px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit;
    transition: border-color .18s ease, color .18s ease;
  }
  .pf-copy:hover { border-color: var(--border-strong); color: var(--text); }
  .pf-copy.ok { color: #34d399; border-color: rgba(52,211,153,.4); }

  /* ---------- Vazio ---------- */
  .pf-empty {
    grid-column: 1 / -1; text-align: center;
    border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 64px 24px; color: var(--text-dim); font-size: 14.5px;
  }
  .pf-empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
  .pf-empty code {
    background: var(--surface-2); padding: 2px 7px; border-radius: 6px; font-size: .92em;
  }

  /* ---------- Rodapé ---------- */
  .pf-footer {
    margin-top: 56px; padding-top: 26px; border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    color: var(--text-mute); font-size: 13px;
  }
  .pf-footer a {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text);
    text-decoration: none; font-size: 14px; font-weight: 500;
    transition: border-color .18s ease, transform .18s ease;
  }
  .pf-footer a:hover { border-color: var(--accent); transform: translateY(-2px); }

  /* ---------- Entrada suave ---------- */
  @keyframes pfIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .pf-anim { opacity: 0; animation: pfIn .55s cubic-bezier(.22,.61,.36,1) both; animation-delay: var(--d, 0ms); }

  @media (prefers-reduced-motion: reduce) {
    .pf-anim { animation: none; opacity: 1; }
    .pf-card, .pf-btn, .pf-copy, .pf-footer a { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="pf-head">
      <img class="pf-logo pf-anim" style="--d:0ms" src="/assets/heaven-logo.webp" alt="Heaven Agência" decoding="async" />
      <span class="pf-tag pf-anim" style="--d:80ms">Portfólio</span>
      <h1 class="pf-anim" style="--d:140ms">
        O que a Heaven entrega, <span class="accent">funcionando</span>.
      </h1>
      <p class="pf-anim" style="--d:200ms">
        Cada projeto abaixo está no ar e pode ser navegado agora. Nada de print em apresentação —
        entre, clique e veja por dentro.
      </p>
    </header>

    <main class="pf-grid" id="pf-grid" aria-label="Projetos"></main>

    <footer class="pf-footer">
      <span>© 2026 Heaven Agência de Marketing · Recife · João Pessoa</span>
      <a href="/forms/">
        Agendar diagnóstico comercial
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </footer>
  </div>

  <script src="/track.js" defer></script>
  <script src="/portfolio/projetos.js" defer></script>
  <script src="/portfolio/portfolio.js" defer></script>
</body>
</html>
