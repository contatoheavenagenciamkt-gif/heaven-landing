# =============================================================================
# nginx — heavenagencia.com
# =============================================================================
# Copie para /etc/nginx/sites-available/heavenagencia e ative:
#
#   sudo ln -s /etc/nginx/sites-available/heavenagencia /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois rode o certbot, que reescreve este arquivo com o HTTPS:
#   sudo certbot --nginx -d heavenagencia.com -d www.heavenagencia.com
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name heavenagencia.com www.heavenagencia.com;

    # Onde estão os arquivos do site (o repositório clonado).
    root /var/www/heaven;
    index index.html;

    # Compressão: o styles.css tem 50 KB, cai pra menos de 10 comprimido.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # ---- Segurança básica --------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header X-Frame-Options          "SAMEORIGIN"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ---- A API ------------------------------------------------------------
    # Tudo em /api vai pro Node. Mesma origem do site: sem CORS, e o cookie de
    # sessão funciona sem configuração extra.
    location /api/ {
        proxy_pass         http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # O .env da API não pode ser servido de jeito nenhum. Esta regra existe
    # como rede de segurança caso alguém mova a pasta api/ para dentro do root.
    location ~ /\.(env|git) { deny all; return 404; }
    location ^~ /api/node_modules { deny all; return 404; }

    # ---- Painel: fora do Google -------------------------------------------
    location /admin { add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri $uri/ =404; }
    location /portfolio { add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri $uri/ =404; }

    # ---- Cache dos assets --------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML sem cache: publicar uma correção não pode depender de o visitante
    # limpar o navegador.
    location ~* \.html$ { expires -1; add_header Cache-Control "no-cache"; }

    # ---- Páginas -----------------------------------------------------------
    # Serve /portfolio/ a partir de /portfolio/index.html, com ou sem barra.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    client_max_body_size 2m;
}
